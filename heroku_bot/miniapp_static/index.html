<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#10141d" />
    <title>MSZ Workspace</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%237bddba'/%3E%3Cpath d='M12 28 28 12M12 12h16v16' stroke='%2310141d' fill='none' stroke-width='3'/%3E%3C/svg%3E"
    />
    <script src="/assets/telegram-web-app.js"></script>
    <script src="/assets/theme.js"></script>
    <link rel="stylesheet" href="/assets/app.css" />
    <script defer src="/assets/app.js"></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#dashboard"
        ><span class="brand-icon">↗</span
        ><span>MSZ<span class="brand-sub">WORKSPACE</span></span></a
      >
      <div class="workspace-tag">
        <span class="live-dot"></span> YOUR BOT, IN ONE PLACE
      </div>
      <nav aria-label="Main navigation">
        <button data-view="dashboard" class="nav-item active">
          <span data-icon="grid"></span>Overview
        </button>
        <button data-view="create" class="nav-item">
          <span data-icon="plus"></span>New task
        </button>
        <button data-view="queue" class="nav-item">
          <span data-icon="layers"></span>Queue
          <span id="queue-count" class="count">0</span>
        </button>
        <button data-view="history" class="nav-item">
          <span data-icon="clock"></span>History
        </button>
        <div class="nav-label">WORKSPACE</div>
        <button data-view="settings" class="nav-item">
          <span data-icon="settings"></span>Settings
        </button>
        <button data-view="tools" class="nav-item">
          <span data-icon="terminal"></span>Tools & logs
        </button>
      </nav>
      <div class="sidebar-foot">
        <div class="online">
          <span class="live-dot"></span><span id="connection">Connecting</span>
        </div>
        <small>Telegram Mini App</small>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div class="crumb">
          <span class="mobile-brand">↗ MSZ</span
          ><span class="desktop-crumb">Workspace <span>/</span></span
          ><b id="page-name">Overview</b>
        </div>
        <div class="topbar-right">
          <button class="text-button browser-logout" id="browser-logout" hidden>
            Log out
          </button>
          <button
            class="icon-button theme-toggle"
            id="theme-toggle"
            aria-label="Switch theme"
            data-icon="sun"
          ></button>
          <span class="live-label"
            ><span class="live-dot"></span
            ><span id="sync">Connecting</span></span
          ><button
            class="icon-button"
            id="refresh"
            aria-label="Refresh"
            data-icon="refresh"
          ></button
          ><span id="avatar" class="avatar">M</span>
        </div>
      </header>
      <main id="content"></main>
      <footer class="page-footer">
        <span>MSZ Workspace</span><span>Made for getting things done.</span>
      </footer>
    </div>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button data-view="dashboard">
        <span data-icon="grid"></span>Overview</button
      ><button data-view="create"><span data-icon="plus"></span>New task</button
      ><button data-view="queue"><span data-icon="layers"></span>Queue</button
      ><button data-view="settings">
        <span data-icon="settings"></span>Settings</button
      ><button data-view="tools">
        <span data-icon="terminal"></span>Tools
      </button>
    </nav>
    <div id="toasts" role="status" aria-live="polite"></div>
    <dialog id="detail">
      <button
        class="icon-button dialog-close"
        aria-label="Close task details"
        data-icon="close"
      ></button>
      <div id="detail-body"></div>
    </dialog>
    <dialog id="endpoint-picker" class="endpoint-picker">
      <div class="picker-heading">
        <div>
          <div class="eyebrow">CONNECTED ACCOUNTS</div>
          <h2 id="picker-title">Choose a source</h2>
        </div>
        <button
          class="icon-button"
          type="button"
          id="picker-close"
          aria-label="Close folder picker"
          data-icon="close"
        ></button>
      </div>
      <div id="picker-providers" class="picker-providers"></div>
      <div class="picker-toolbar">
        <input
          type="search"
          id="picker-search"
          class="search"
          placeholder="Search loaded chats, topics or folders"
          aria-label="Search indexed entries"
        /><button
          class="button secondary small"
          type="button"
          id="picker-refresh"
        >
          Refresh index
        </button>
      </div>
      <p id="picker-note" class="muted"></p>
      <form id="picker-topic-form" class="picker-topic-form field" hidden>
        <label for="picker-topic-title" id="picker-topic-label">New topic name</label>
        <input id="picker-topic-title" placeholder="Enter a topic name" maxlength="128" required autocomplete="off" />
        <p class="muted">Creates a real Telegram topic using your connected account.</p>
        <div class="button-row">
          <button class="button small" id="picker-topic-submit" type="submit">Create & select</button>
          <button class="button secondary small" id="picker-topic-cancel" type="button">Cancel</button>
        </div>
        <p id="picker-topic-error" class="picker-error" role="status"></p>
      </form>
      <div id="picker-tree" class="picker-tree" aria-live="polite"></div>
      <div class="picker-footer">
        <div id="picker-selection" class="muted">
          Choose an entry to continue.
        </div>
        <button class="button" type="button" id="picker-choose" disabled>
          Use selection
        </button>
      </div>
    </dialog>
    <script src="/assets/picker.js" defer></script>
    <dialog id="confirm">
      <div class="confirm-icon" data-icon="alert"></div>
      <h2 id="confirm-title">Confirm action</h2>
      <p id="confirm-text"></p>
      <div class="button-row">
        <button class="button secondary" id="confirm-no">Keep it</button
        ><button class="button danger" id="confirm-yes">Confirm</button>
      </div>
    </dialog>
  </body>
</html>
